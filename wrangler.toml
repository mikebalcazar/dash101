# dash101 como Worker de Cloudflare (fase 4). Decisiones D1 y D2 del arranque.
#
# Dos Workers con el mismo código: `dash101-staging`, que habla con la API de
# staging y trae la org `demo`, y `dash101`, que habla con la de producción.
# Netlify sigue vivo al lado hasta el corte (D3): esto no apaga nada.
#
# Las llaves no están aquí ni pueden estarlo: el despliegue lo hace el
# corredor con los secretos de Actions del repositorio.

name = "dash101"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Desde el 25-sep-2026 dash101 vive también en dash101.taller101.com: el DNS
# de taller101.com está en Cloudflare (Mike lo movió ese día) y el Worker se
# cuelga del dominio como *custom domain*: Cloudflare pone el registro y el
# certificado; aquí no hay IPs. La dirección en workers.dev sigue viva.
# Con `routes` puesto, wrangler APAGA el subdominio workers.dev si no se le
# dice lo contrario (peek101 se quedó sin su dirección vieja un minuto el
# 25-sep: «error code: 1042»). Las dos direcciones se quedan.
workers_dev = true
routes = [
  { pattern = "dash101.taller101.com", custom_domain = true }
]

# Lo que Next deja construido; el Worker lo sirve como archivos.
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# La API, desde el mismo origen. No hay URL: es un *service binding*, o sea
# una llamada de Worker a Worker que nunca sale a internet.
[[services]]
binding = "API"
service = "suite101-api"

[observability]
enabled = true

# ─────────────── staging ───────────────
# Es donde todo se prueba primero (D5), contra la org `demo` (D6).

[env.staging]
name = "dash101-staging"
# `routes` se hereda del nivel de arriba; staging NO se cuelga del dominio.
routes = []
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[[env.staging.services]]
binding = "API"
service = "suite101-api-staging"

[env.staging.observability]
enabled = true
