# Publica dash101 como Worker de Cloudflare y luego mide lo que publicó.
#
# Esto NO apaga Netlify. Hasta el corte la app de verdad sigue siendo la de
# Netlify contra Firestore (decisión D3); aquí nace la misma app hablando con
# la suite, en su propia dirección, para poder compararlas lado a lado.
#
# El chat que escribe el código no alcanza api.cloudflare.com ni *.workers.dev:
# el proxy de salida se lo rechaza. Aquí sí hay internet, así que todo lo que
# hay que saber se mide aquí y se devuelve por el comentario del commit, que es
# el único canal de vuelta que el chat puede leer (OPERAR.md §6).
#
# Secretos del repositorio:
#   CLOUDFLARE_API_TOKEN    Workers Scripts:Edit, Account Settings:Read,
#                           User Details:Read
#   CLOUDFLARE_ACCOUNT_ID
#
# Qué empresa sirve el Worker de producción: `forespot`, la de verdad.
#
# **Es una decisión de Mike, tomada el 12-sep-2026**, y se le planteó con su
# consecuencia enfrente: hasta el corte la app de verdad sigue siendo la de
# Netlify contra Firestore (D3), así que desde hoy hay DOS direcciones de
# dash101 sirviendo la misma empresa contra DOS bases distintas. Lo que se
# capture en una no aparece en la otra. Mike lo sabe y así lo quiere: lo que
# gana es ver la app real corriendo sobre la suite antes de decidir el corte.
#
# La variable del repositorio `ORG_PRODUCCION` puede cambiarlo sin tocar
# código (Settings ▸ Secrets and variables ▸ Actions ▸ Variables). Si no
# está, manda lo que dice aquí abajo, que es la decisión escrita.

name: Publicar el Worker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'claude/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: despliegue-dash101
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # La decisión escrita; la variable del repositorio manda si existe.
      ORG_PRODUCCION: ${{ vars.ORG_PRODUCCION || 'forespot' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Sin esto, wrangler falla con un error de autenticación que no dice qué
      # hacer. Este paso sí lo dice, y el chat lo puede leer en el comentario
      # del commit: el chat no lista ni lee secretos, sólo pregunta si están.
      - name: Comprobar que hay con qué publicar
        run: |
          falta=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || falta="$falta CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || falta="$falta CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$falta" ]; then
            echo "::error::Faltan secretos del repositorio dash101:$falta. Los pone Mike en Settings ▸ Secrets and variables ▸ Actions. El token necesita Workers Scripts:Edit, Account Settings:Read y User Details:Read; son los mismos que ya tiene suite101-api."
            exit 1
          fi
          echo "los dos secretos están puestos"

      - name: Los tipos, los de la app y los del Worker
        run: |
          npm run tipos
          npm run tipos:worker

      # ── staging ──────────────────────────────────────────────────────────
      # La empresa se decide al construir (lib/fuente.ts), así que hay que
      # construir una vez por entorno: el nombre queda dentro del paquete.

      - name: Construir para staging (org demo)
        env:
          NEXT_PUBLIC_FUENTE: api
          NEXT_PUBLIC_ORG: demo
          NEXT_PUBLIC_VERSION: ${{ github.sha }}
          EN_WORKER: '1'
        run: npm run worker:build

      # El 12-sep la primera publicación contestó 500 en todas las pantallas:
      # el paquete del servidor traía la construcción de Node de Firestore, y
      # con ella protobufjs, que fabrica funciones con `new Function` al
      # cargar. Un Worker no lo permite. El arreglo está en next.config.ts; el
      # que no vuelva, se comprueba aquí. Es una sola línea y no cuesta nada.
      - name: Que el Worker no traiga el codegen de protobufjs (staging)
        run: |
          if grep -q 'codegen: ' .open-next/worker.js; then
            echo "::error::El paquete del Worker trae el codegen de protobufjs. Eso da 500 en todas las pantallas en cuanto se publique. Revisa el alias de Firebase en next.config.ts (FIREBASE_NAVEGADOR): hay que apuntar los dos niveles, `firebase/*` y `@firebase/*`."
            exit 1
          fi
          echo "limpio: sin generación de código en el paquete del servidor"

      - name: Publicar staging
        id: staging
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging | tee /tmp/staging.txt
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/staging.txt | head -1)
          [ -n "$url" ] || { echo 'no pude sacar la liga de la salida de wrangler' >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "staging publicado: $url"

      - name: Medir staging
        id: medir_staging
        continue-on-error: true
        env:
          STAGING: ${{ steps.staging.outputs.url }}
          VERSION_ESPERADA: ${{ github.sha }}
        run: |
          set -u
          exec > >(tee /tmp/medido-staging.txt) 2>&1
          # Ya no hay `sleep` a ciegas: el medidor espera hasta ver la versión
          # que se acaba de construir, y apunta cuántos intentos costó.
          node scripts/medir.mjs

      # Si algo contestó 500, el mensaje de error vive en los logs del Worker,
      # y ahí sólo llega este corredor: el chat no alcanza api.cloudflare.com.
      # Se escucha el Worker con `wrangler tail`, se le vuelve a pedir la
      # portada y una ruta [id] mientras se escucha, y lo que diga se pega a
      # la medición para que vuelva en el comentario del commit. El 12-sep
      # esto fue la diferencia entre adivinar y leer.
      - name: Leer los errores del Worker de staging
        if: steps.medir_staging.outcome == 'failure'
        env:
          STAGING: ${{ steps.staging.outputs.url }}
        run: |
          set -u
          {
            echo
            echo "== Lo que dice el Worker de staging (wrangler tail) =="
            npx wrangler tail dash101-staging --env staging --format json > /tmp/tail.jsonl 2>/tmp/tail.err &
            TAIL=$!
            sleep 8
            curl -s -o /dev/null -w 'GET /  → %{http_code}\n' "$STAGING/"
            curl -s -o /dev/null -w 'GET /proyectos/no-existe-a-proposito  → %{http_code}\n' "$STAGING/proyectos/no-existe-a-proposito"
            sleep 6
            kill $TAIL 2>/dev/null || true
            wait $TAIL 2>/dev/null || true
            python3 - <<'PY'
          import json
          vistos = 0
          try:
              for linea in open('/tmp/tail.jsonl'):
                  linea = linea.strip()
                  if not linea: continue
                  try: e = json.loads(linea)
                  except Exception: continue
                  vistos += 1
                  ev = e.get('event') or {}
                  print(f"-- {ev.get('request',{}).get('method','?')} {ev.get('request',{}).get('url','?')}  →  {e.get('outcome')}")
                  for x in e.get('exceptions', []):
                      print('   EXCEPCION:', x.get('name'), x.get('message'))
                      if x.get('stack'): print('   ', str(x['stack'])[:1500])
                  for l in e.get('logs', []):
                      print('   log', l.get('level'), ' '.join(str(m) for m in l.get('message', []))[:1500])
          except FileNotFoundError:
              pass
          if not vistos:
              print('(wrangler tail no entregó eventos)')
              try: print(open('/tmp/tail.err').read()[-1500:])
              except Exception: pass
          PY
          } >> /tmp/medido-staging.txt 2>&1
          tail -60 /tmp/medido-staging.txt

      - name: Que la medición de staging mande
        if: steps.medir_staging.outcome == 'failure'
        run: exit 1

      # ── producción ───────────────────────────────────────────────────────
      # Sólo si staging salió bien (los pasos van en orden y sin
      # `continue-on-error`) y sólo si Mike ya dijo qué empresa sirve.

      - name: Construir para producción
        if: env.ORG_PRODUCCION != ''
        env:
          NEXT_PUBLIC_FUENTE: api
          NEXT_PUBLIC_ORG: ${{ vars.ORG_PRODUCCION || 'forespot' }}
          NEXT_PUBLIC_VERSION: ${{ github.sha }}
          EN_WORKER: '1'
        run: npm run worker:build

      # El 12-sep la primera publicación contestó 500 en todas las pantallas:
      # el paquete del servidor traía la construcción de Node de Firestore, y
      # con ella protobufjs, que fabrica funciones con `new Function` al
      # cargar. Un Worker no lo permite. El arreglo está en next.config.ts; el
      # que no vuelva, se comprueba aquí. Es una sola línea y no cuesta nada.
      - name: Que el Worker no traiga el codegen de protobufjs (producción)
        run: |
          if grep -q 'codegen: ' .open-next/worker.js; then
            echo "::error::El paquete del Worker trae el codegen de protobufjs. Eso da 500 en todas las pantallas en cuanto se publique. Revisa el alias de Firebase en next.config.ts (FIREBASE_NAVEGADOR): hay que apuntar los dos niveles, `firebase/*` y `@firebase/*`."
            exit 1
          fi
          echo "limpio: sin generación de código en el paquete del servidor"
        if: env.ORG_PRODUCCION != ''

      - name: Publicar producción
        id: produccion
        if: env.ORG_PRODUCCION != ''
        run: |
          set -euo pipefail
          npx wrangler deploy | tee /tmp/prod.txt
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/prod.txt | head -1)
          [ -n "$url" ] || { echo 'no pude sacar la liga de la salida de wrangler' >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "producción publicada: $url"

      - name: Medir producción
        if: env.ORG_PRODUCCION != ''
        env:
          PROD: ${{ steps.produccion.outputs.url }}
          ORG_PROD: ${{ vars.ORG_PRODUCCION || 'forespot' }}
          VERSION_ESPERADA: ${{ github.sha }}
        run: |
          set -u
          exec > >(tee /tmp/medido-prod.txt) 2>&1
          node scripts/medir.mjs

      # Sólo puede pasar si alguien pone la variable del repositorio en vacío a
      # propósito. Se deja el camino para que se pueda apagar producción sin
      # tocar código, y para que el comentario del commit diga qué pasó.
      - name: Decir que producción no se publicó, y por qué
        if: env.ORG_PRODUCCION == ''
        run: |
          echo "::notice::Sólo se publicó staging: la variable ORG_PRODUCCION del repositorio está en vacío."
          echo "Producción: no se publicó. La variable ORG_PRODUCCION está en vacío." > /tmp/medido-prod.txt

      # Aquí está el canal de vuelta. El log de Actions no sirve: descargarlo
      # redirige a un host que el proxy del chat también rechaza.
      - name: Dejar lo medido en el commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          : > /tmp/salida.txt
          for f in /tmp/medido-staging.txt /tmp/medido-prod.txt; do
            [ -f "$f" ] && cat "$f" >> /tmp/salida.txt
          done
          [ -s /tmp/salida.txt ] || echo "No hubo salida que reportar: el flujo se cayó antes de medir." > /tmp/salida.txt
          jq -Rs '{body: ("**dash101 como Worker**\n\n```\n" + .[-60000:] + "\n```")}' /tmp/salida.txt > /tmp/comentario.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @/tmp/comentario.json -o /tmp/respuesta.json -w 'comentario: %{http_code}\n'
          head -c 200 /tmp/respuesta.json || true
