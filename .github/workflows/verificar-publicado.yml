# Las direcciones viejas de Netlify: que no sirvan nada de la suite.
#
# 16-sep-2026: `conta-master.netlify.app` y `cuenta-taller101.netlify.app`
# dejaron de servir sus apps y mandan a los Workers con puerta.
# 24-sep-2026: Netlify se retiró de la suite (lo decidió Mike, con la cuenta
# suspendida por uso). Falta que Mike borre los sitios en netlify.com —el
# conector del chat no borra—; hasta entonces `netlify.toml`,
# `netlify-publica/` y `portal/` se quedan: son la regla que hace que un sitio
# que volviera a construir redirija en vez de servir.
#
# Lo que se mide, por dirección:
#   · no resuelve, 404 o 410: el sitio ya no existe. Cerrado.
#   · 5xx: Netlify suspendido o caído. El sitio EXISTE y vuelve con la cuota:
#     se avisa (amarillo) que falta borrarlo. No es un defecto del repositorio.
#   · 3xx: tiene que mandar al Worker, sin llave en el cuerpo y sin reenviar
#     /s101 a la API. Si no, rojo.
#   · 200 u otra cosa: está sirviendo algo. Rojo.
# Cuando las dos digan «ya no existe», este flujo y los archivos de Netlify
# se borran.

name: Verificar lo publicado

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Las direcciones viejas no sirven nada
        run: |
          set -uo pipefail
          fallas=0
          medir() {
            local vieja=$1 nueva=$2
            local codigo donde cuerpo salud
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "$vieja/" || true)
            donde=$(curl -s -o /dev/null -w '%{redirect_url}' "$vieja/" || true)
            echo "$vieja/ → $codigo ${donde:+Location: $donde}"
            case "$codigo" in
              000|404|410)
                echo "  ya no existe: cerrado" ;;
              5??)
                echo "::warning::$vieja contestó $codigo: Netlify suspendido o caído. El sitio sigue existiendo y vuelve con la cuota; falta borrarlo en netlify.com." ;;
              301|302|303|307|308)
                case "$donde" in
                  "$nueva"/*|"$nueva") echo "  manda a $nueva" ;;
                  *) echo "::error::$vieja redirige a otro lado ($donde)"; fallas=$((fallas+1)) ;;
                esac
                # Sin seguir la redirección: con -L el cuerpo sería el del Worker.
                for ruta in / /index.html; do
                  cuerpo=$(curl -s "$vieja$ruta" || true)
                  for prohibido in 'AIzaSy' 'firebaseapp.com' 'firestore.googleapis.com' 'identitytoolkit' '_next/static'; do
                    if printf '%s' "$cuerpo" | grep -q "$prohibido"; then
                      echo "::error::$vieja$ruta está sirviendo «$prohibido»"; fallas=$((fallas+1))
                    fi
                  done
                done
                salud=$(curl -s -o /dev/null -w '%{http_code}' "$vieja/s101/salud" || true)
                if [ "$salud" = 200 ]; then
                  echo "::error::$vieja todavía reenvía /s101/* a la API de producción"; fallas=$((fallas+1))
                fi
                echo "::warning::$vieja todavía existe en Netlify (sólo redirige): falta borrarlo en netlify.com." ;;
              *)
                echo "::error::$vieja contesta $codigo: está sirviendo algo, y no debería"; fallas=$((fallas+1)) ;;
            esac
          }
          medir https://conta-master.netlify.app https://dash101.mike-929.workers.dev
          medir https://cuenta-taller101.netlify.app https://peek101.mike-929.workers.dev
          [ "$fallas" = 0 ] || exit 1
          echo "ninguna dirección vieja sirve nada de la suite"
